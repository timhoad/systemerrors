      @font-face {
        font-family: OCR A Std;
        src: url("ocr-a-std.ttf");
      }

      div {
        font-family: OCR A Std;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #000;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }

      /* =========================================================
         BACKGROUND VIDEO
         ========================================================= */

      .video-background-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .background-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
      }

      /* Both videos hidden by default */
      .background-video.portrait,
      .background-video.landscape {
        display: none;
      }

      /* Show portrait video on portrait screens */
      @media (orientation: portrait) {
        .background-video.portrait {
          display: block;
        }

        .background-video.landscape {
          display: none;
        }
      }

      /* Show landscape video on landscape screens */
      @media (orientation: landscape) {
        .background-video.portrait {
          display: none;
        }

        .background-video.landscape {
          display: block;
        }
      }

      /* =========================================================
         PREVENT SCROLL ON MAIN PUZZLE PAGE FOR MOBILE
         ========================================================= */

      body.noscroll,
      html.noscroll {
        overflow: hidden !important;
        height: 100vh !important;
        position: fixed !important;
        width: 100vw !important;
        overscroll-behavior: none;
        touch-action: none;
      }
